name: Reusable Lint, Format & Test Workflow

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: 📥 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🔍 Run ESLint
        run: yarn lint

      - name: 💅 Check code formatting
        run: yarn format --check

      - name: 🧪 Run unit tests
        run: yarn test

      - name: 🔍 Check if CODECOV_TOKEN is provided
        id: check-codecov-token
        if: always()
        run: |
          if [ -n "${{ secrets.CODECOV_TOKEN }}" ]; then
            echo "token-provided=true" >> $GITHUB_OUTPUT
          else
            echo "token-provided=false" >> $GITHUB_OUTPUT
          fi

      - name: 📊 Upload coverage reports
        if: always() && steps.check-codecov-token.outputs.token-provided == 'true'
        uses: codecov/codecov-action@v4
